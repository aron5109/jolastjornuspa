name: Byggja og birta á GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Default: read-only. The deploy job asks for the extra Pages permissions it needs.
permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  # Never cancel a running Pages deployment; superseded PR runs can go.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Prófa og byggja
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # actions/configure-pages reads the repository's Pages settings with this job's token.
      pages: read
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies (lockfile)
        run: npm ci

      - name: Validate content (372 forecasts, Moon data)
        run: npm run validate

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Configure Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    name: Birta
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
